<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevGameZone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navegación Superior -->
  <header class="navbar">
    <div class="logo">DEV<span>GAMEZONE</span></div>
    <div class="menu-icon">&#9776;</div>
  </header>

  <!-- Banner Hero & Buscador -->
  <section class="hero">
    <p class="subtitle">El mejor clasificador de videojuegos Android</p>
    <div class="search-box">
      <input type="text" placeholder="Buscar una aplicación...">
      <button type="submit">&#128090;</button>
    </div>
  </section>

  <!-- Sección Principal de Tarjetas -->
  <main class="content-container">
    <h2>Últimas aplicaciones de nuestra web</h2>

    <div class="games-grid">

      <!-- Tarjeta 1 -->
      <div class="card">
        <div class="card-img">
          <img src="https://via.placeholder.com/300x400" alt="Juego 1">
        </div>
        <div class="card-body">
          <h3 class="card-title">Red Dustlands On...</h3>
          <p class="card-author">Virtual Studio Team</p>
          <a href="#" class="btn-more">Ver más</a>
        </div>
      </div>

      <!-- Tarjeta 2 -->
      <div class="card">
        <div class="card-img">
          <img src="https://via.placeholder.com/300x400" alt="Juego 2">
        </div>
        <div class="card-body">
          <h3 class="card-title">DRIFT RIDE 2: Tra...</h3>
          <p class="card-author">UNDERDRIFT GAMES</p>
          <p class="card-version">Versión --</p>
          <div class="stars">★★★★☆</div>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
